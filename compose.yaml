name: pyme-contable

x-php: &php
  build:
    context: docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: pyme-contable-php:dev
  volumes:
    - ./backend:/var/www/backend
  environment:
    # Variables de proceso: Laravel las prefiere sobre backend/.env.
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: pyme
    DB_USERNAME: pyme_owner
    DB_PASSWORD: ${PYME_OWNER_PASSWORD:?definir en .env}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      PYME_OWNER_PASSWORD: ${PYME_OWNER_PASSWORD:?definir en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      # Por TCP: el servidor temporal del init solo escucha por socket, así no se marca sano a mitad del init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pyme_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  php:
    <<: *php

volumes:
  pgdata: