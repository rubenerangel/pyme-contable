name: pyme-contable

x-php: &php
  build:
    context: docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: pyme-contable-php:dev
  volumes:
    - ./backend:/var/www/backend
  environment:
    # Home escribible para herramientas CLI (tinker/psysh, composer); www-data no tiene uno propio.
    HOME: /tmp
    # Variables de proceso: Laravel las prefiere sobre backend/.env.
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: pyme
    # The app runs as pyme_app; pgsql_owner (pyme_owner) is only for migrating.
    DB_USERNAME: pyme_app
    DB_PASSWORD: ${PYME_APP_PASSWORD:?definir en .env}
    DB_OWNER_USERNAME: pyme_owner
    DB_OWNER_PASSWORD: ${PYME_OWNER_PASSWORD:?definir en .env}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      PYME_OWNER_PASSWORD: ${PYME_OWNER_PASSWORD:?definir en .env}
      PYME_APP_PASSWORD: ${PYME_APP_PASSWORD:?definir en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      # Por TCP: el servidor temporal del init solo escucha por socket, así no se marca sano a mitad del init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pyme_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  php:
    <<: *php

  worker:
    <<: *php
    # Reciclar el proceso acota estado acumulado; el contexto de empresa se fija y limpia por job (bloque 3).
    command: ["php", "artisan", "queue:work", "--tries=1", "--max-jobs=500", "--max-time=3600"]
    user: www-data
    restart: unless-stopped

  node:
    image: node:24-bookworm-slim
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_update_notifier: "false"
    # Mismo node_modules que npmd. Solo instala si falta; tras cambiar dependencias usa npmd npm install.
    command: ["sh", "-c", "[ -d node_modules ] || npm ci; exec npm run dev"]
    volumes:
      - ./frontend:/app

  nginx:
    image: nginx:stable-bookworm
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - node

volumes:
  pgdata: