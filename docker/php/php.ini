; Log timestamps in UTC. The accounting date in America/Bogota is derived in the domain.
date.timezone = UTC
memory_limit = 512M
expose_php = Off
; A fatal error must not show in the response: it goes to the FPM log (container stderr).
display_errors = Off
display_startup_errors = Off
log_errors = On

; Dev: opcache revalidates on every request to see changes instantly.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0