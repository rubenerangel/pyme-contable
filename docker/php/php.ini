; Timestamps de registro en UTC. La fecha contable en America/Bogota se deriva en dominio.
date.timezone = UTC
memory_limit = 512M
expose_php = Off

; Dev: opcache revalida en cada request para ver cambios al instante.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0