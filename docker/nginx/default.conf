# Single origin: SPA (Vite in dev) and API (PHP-FPM) under the same host and port.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;
    server_tokens off;

    # Backend: versioned API, Sanctum and Laravel health check.
    location ~ ^/(api|sanctum)/|^/up$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        # The nginx id replaces any X-Request-Id of the client.
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_read_timeout 60s;
    }

    # Everything else: Vite dev server, with websocket for HMR.
    location / {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}