name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Same images, same Postgres and same init as in development, via Compose.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI environment variables
        run: |
          printf 'POSTGRES_PASSWORD=ci\nPYME_OWNER_PASSWORD=ci\nPYME_APP_PASSWORD=ci\nPG_HOST_PORT=5432\nAPP_HOST_PORT=8080\nUID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
          cp backend/.env.example backend/.env

      - name: Build PHP image
        run: docker compose build php

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Install dependencies
        run: docker compose run --rm -u www-data php composer install --no-interaction --prefer-dist --no-progress

      - name: Application key
        run: docker compose run --rm -u www-data php php artisan key:generate --no-interaction

      - name: Pest
        run: docker compose run --rm -u www-data php vendor/bin/pest

      - name: Postgres logs
        if: failure()
        run: docker compose logs postgres

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build