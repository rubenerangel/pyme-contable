name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Same images, same Postgres and same init as in development, via Compose.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CI environment variables
        run: |
          printf 'POSTGRES_PASSWORD=ci\nPYME_OWNER_PASSWORD=ci\nPYME_APP_PASSWORD=ci\nPG_HOST_PORT=5432\nAPP_HOST_PORT=8080\nUID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
          cp backend/.env.example backend/.env

      - name: Build PHP image
        run: docker compose build php

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Install dependencies
        run: docker compose run --rm -u www-data php composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: docker compose run --rm -u www-data php composer audit --no-interaction

      - name: Application key
        run: docker compose run --rm -u www-data php php artisan key:generate --no-interaction

      - name: Pest
        run: docker compose run --rm -u www-data php vendor/bin/pest

      # One migrate:fresh per mutation (about 30 s for 11 locally), so it runs on every push and PR.
      - name: SQL mutations
        run: python3 scripts/mutants.py

      - name: Postgres logs
        if: failure()
        run: docker compose logs postgres

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  guards:
    # The agent hook and the test gate are controls: their tests run like any other.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hook tests
        run: python3 -m unittest discover -s .claude/hooks -v

      - name: Gate and mutation runner tests
        run: python3 -m unittest discover -s scripts -v

      - name: settings.json is valid JSON
        run: python3 -m json.tool .claude/settings.json > /dev/null

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD":/repo:ro -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.13.1@sha256:1fd499f411a9ff121fda3207af1c8d32e2a92648c19fb1847553c5b79ca4c281 < docker/php/Dockerfile

      - name: Compose file
        run: |
          printf 'POSTGRES_PASSWORD=ci\nPYME_OWNER_PASSWORD=ci\nPYME_APP_PASSWORD=ci\n' > .env
          docker compose config --quiet
